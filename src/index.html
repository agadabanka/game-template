<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1020" />
    <title>Game Template</title>
    <meta name="description" content="A low-gravity space platformer: float across five sealed zones of a dying station to reach the escape pod. Built on the game-engine, deployed on Railway." />
    <style>
      /* pixel-art fonts (OFL) for full UI cohesion */
      @font-face { font-family: 'PressStart2P'; src: url('/assets/fonts/PressStart2P.ttf') format('truetype'); font-display: block; }
      @font-face { font-family: 'Silkscreen'; src: url('/assets/fonts/Silkscreen.ttf') format('truetype'); font-display: block; }
      :root { --bg1: #0b1020; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(1200px 800px at 50% -15%, #1b2c58, var(--bg1) 62%);
        color: #e8eefc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100dvh; overflow: hidden;
        -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
      }
      #game { width: 100vw; height: 100dvh; }
      #game canvas { display: block; margin: auto; border-radius: 10px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
      #loader {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center;
        background: var(--bg1); transition: opacity .6s ease;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      .spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid #29335a; border-top-color: #ffd34d; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tag { font-weight: 800; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: #9fb3e0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loader"><div class="spinner"></div><div class="tag">Booting…</div></div>
    <script src="/vendor/phaser.min.js"></script>
    <script>
      // Ensure pixel fonts are ready before Phaser renders any text.
      window.__fontsReady = (async () => {
        try {
          await Promise.all([
            document.fonts.load('16px PressStart2P'),
            document.fonts.load('16px Silkscreen'),
          ]);
          await document.fonts.ready;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/game/main.js"></script>
  </body>
</html>
